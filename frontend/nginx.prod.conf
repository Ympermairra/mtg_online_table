server {
    listen 5173;
    root /usr/share/nginx/html;

    # Файлы с хешем в имени можно кешировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: все неизвестные пути отдаём в index.html
    location / {
        try_files $uri /index.html;
    }
}
